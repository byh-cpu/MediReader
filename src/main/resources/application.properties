spring.application.name=MediReader
server.port=8080

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:7b-instruct
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.embedding.options.model=bge-m3
spring.ai.ollama.init.chat.enabled=false
spring.ai.ollama.init.embedding.enabled=false

# Vision model for image recognition
medireader.vision-model=minicpm-v

# Longer timeouts for vision model processing
spring.mvc.async.request-timeout=600000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# DevTools - exclude data directory from restart trigger
spring.devtools.restart.additional-exclude=data/**

# MediReader Data Paths
medireader.data-dir=./data
medireader.vectorstore-path=./data/vectorstore.json
medireader.knowledge-dir=./data/knowledge
medireader.metadata-path=./data/knowledge-metadata.json
medireader.tessdata-dir=./data/tessdata
